[project]
name = "sample-auth-app"
version = "0.1.0"
description = "Sample FastAPI resource server protected by Entra ID"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.122",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.14",
]

[dependency-groups]
dev = [
    "authlib>=1.9.5",
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff>=0.17.4",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ERA", "FAST", "ASYNC", "PT", "RUF", "C4", "RET", "PIE"]

[tool.ruff.lint.per-file-ignores]
"scripts/demo_client.py" = ["N802"]
